name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build plug-in
        uses: nsis-dev/release-package@ebe53b3b0a66177ed65d6accc94d466ee8881c16 # v0.3.0
        with:
          name: untgz
          sources: |
            Contrib/untgz/bz2.c
            Contrib/untgz/bzip2-1.0.3/blocksort.c
            Contrib/untgz/bzip2-1.0.3/bzlib.c
            Contrib/untgz/bzip2-1.0.3/compress.c
            Contrib/untgz/bzip2-1.0.3/crctable.c
            Contrib/untgz/bzip2-1.0.3/decompress.c
            Contrib/untgz/bzip2-1.0.3/huffman.c
            Contrib/untgz/bzip2-1.0.3/randtable.c
            Contrib/untgz/lzma/LzmaDecode.c
            Contrib/untgz/lzma/lzma.c
            Contrib/untgz/nsisUtils.c
            Contrib/untgz/untar.c
            Contrib/untgz/untgz.cpp
            Contrib/untgz/untgz.rc
            Contrib/untgz/zlib/adler32.c
            Contrib/untgz/zlib/crc32.c
            Contrib/untgz/zlib/gzio.c
            Contrib/untgz/zlib/inffast.c
            Contrib/untgz/zlib/inflate.c
            Contrib/untgz/zlib/inftrees.c
            Contrib/untgz/zlib/zutil.c
          strict: false
          release: ${{ github.event_name == 'release' }}
